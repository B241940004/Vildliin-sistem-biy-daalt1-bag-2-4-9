<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread Pool: worker activity</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b2430; --mute:#667085; --line:#d9dee6;
  --idle:#e4e8ee; --run:#1f7a5a; --queue:#c9871f; --bad:#b3401f; --accent:#2b5bd7;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181f; --panel:#1c222c; --ink:#e8ecf2; --mute:#97a1b0; --line:#2f3745;
    --idle:#2a313d; --run:#3fb68b; --queue:#e0a43c; --bad:#e2704d; --accent:#7fa2ff; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:21px;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 18px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
h2{font-size:14px;margin:0 0 10px;font-weight:650}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%}
button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:5px;padding:7px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
#msg{color:var(--bad);font-size:13px;min-height:18px}
.workers{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.w{border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--idle);transition:background .12s,color .12s}
.w.run{background:var(--run);color:#fff;border-color:var(--run)}
.w b{display:block;font-size:13px}
.w span{font-size:12px;opacity:.9}
.queue{display:flex;gap:5px;flex-wrap:wrap;min-height:34px}
.slot{width:38px;height:30px;border:1px dashed var(--line);border-radius:4px;display:grid;place-items:center;font-size:12px;color:var(--mute)}
.slot.full{border:1px solid var(--queue);background:var(--queue);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stats div{font-size:13px;color:var(--mute)}
.stats strong{display:block;font-size:19px;color:var(--ink)}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--mute);font-size:11px;font-family:inherit}
.bad{color:var(--bad)}
.legend{font-size:12.5px;color:var(--mute);margin:8px 0 0}
@media (prefers-reduced-motion: reduce){ .w{transition:none} }
</style>
</head>
<body>
<main>
  <h1>Thread Pool: worker activity</h1>
  <p class="sub">II-4-9 · F.CSM302 · Бодит C (pthread) thread pool-ийн ажиллагааны лог дээр суурилсан дүрслэл</p>

  <section>
    <h2>Параметр</h2>
    <form id="f">
      <label>Worker-ийн тоо (1–16)<input name="workers" type="number" value="4" min="1" max="16"></label>
      <label>Queue-ийн багтаамж (1–32)<input name="queue" type="number" value="6" min="1" max="32"></label>
      <label>Task-ийн тоо (1–200)<input name="tasks" type="number" value="20" min="1" max="200"></label>
      <label>Task min (мс)<input name="min" type="number" value="200" min="1" max="5000"></label>
      <label>Task max (мс)<input name="max" type="number" value="800" min="1" max="5000"></label>
      <label>Submit завсар (мс)<input name="interval" type="number" value="40" min="0" max="2000"></label>
    </form>
    <div class="row">
      <button id="run" type="button">Ажиллуулах</button>
      <button id="pause" type="button" class="ghost" disabled>Түр зогсоох</button>
      <button id="replay" type="button" class="ghost" disabled>Дахин үзүүлэх</button>
      <label style="flex-direction:row;align-items:center;gap:6px">Хурд
        <select id="speed" style="width:auto"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
      </label>
      <span id="msg" role="status"></span>
    </div>
  </section>

  <section>
    <h2>Worker-ууд <span id="clock" style="font-weight:400;color:var(--mute)"></span></h2>
    <div class="workers" id="workers"></div>
  </section>

  <section>
    <h2>Task queue</h2>
    <div class="queue" id="queue"></div>
    <p class="legend">Дараалал дүүрсэн үед submit татгалзагдаж, thread pool task-ийг хүлээлгэн дахин оролдоно.</p>
  </section>

  <section>
    <h2>Цагийн диаграмм</h2>
    <svg id="gantt" viewBox="0 0 900 100" role="img" aria-label="Worker бүрийн task гүйцэтгэлийн цагийн диаграмм"></svg>
  </section>

  <section>
    <h2>Үзүүлэлт</h2>
    <div class="stats" id="stats"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let data = null, tasks = {}, rejects = [], T = 0, playing = false, last = 0, total = 1, W = 0, Q = 0;

function msg(t){ $('msg').textContent = t || ''; }

async function run(){
  msg('');
  const q = new URLSearchParams(new FormData($('f')));
  $('run').disabled = true;
  try{
    const r = await fetch('/api/run?' + q);
    const j = await r.json();
    if(!r.ok || j.error){ msg(j.error || 'Алдаа гарлаа'); return; }
    data = j; prepare(); play(0);
  }catch(e){ msg('Серверт холбогдож чадсангүй. serve.py ажиллаж байгаа эсэхийг шалгана уу.'); }
  finally{ $('run').disabled = false; }
}

function prepare(){
  tasks = {}; rejects = []; const seenRej = new Set();
  W = data.params.workers; Q = data.params.queue;
  for(const e of data.events){
    if(e.e === 'submit') tasks[e.k] = {id:e.k, sub:e.t};
    else if(e.e === 'start'){ tasks[e.k].start = e.t; tasks[e.k].w = e.w; }
    else if(e.e === 'done') tasks[e.k].end = e.t;
    else if(e.e === 'rejected' && !seenRej.has(e.k)){ seenRej.add(e.k); rejects.push(e.t); }
  }
  total = Math.max(data.summary.total_ms, 1);
  $('replay').disabled = false; $('pause').disabled = false;
  const ws = $('workers'); ws.innerHTML = '';
  for(let i=1;i<=W;i++){
    const d = document.createElement('div'); d.className='w'; d.id='w'+i;
    d.innerHTML = '<b>Worker '+i+'</b><span>idle</span>'; ws.appendChild(d);
  }
  const qs = $('queue'); qs.innerHTML = '';
  for(let i=0;i<Q;i++){ const s=document.createElement('div'); s.className='slot'; s.id='q'+i; qs.appendChild(s); }
}

function play(from){ T = from; playing = true; last = performance.now(); $('pause').textContent='Түр зогсоох'; requestAnimationFrame(tick); }

function tick(now){
  if(!playing) return;
  T += (now - last) * parseFloat($('speed').value); last = now;
  if(T >= total){ T = total; playing = false; }
  render();
  if(playing) requestAnimationFrame(tick);
}

function hue(k){ return (k * 47) % 360; }

function render(){
  $('clock').textContent = '· ' + (T/1000).toFixed(2) + ' / ' + (total/1000).toFixed(2) + ' с';
  const all = Object.values(tasks);
  const done = new Array(W+1).fill(0), busy = new Array(W+1).fill(0);
  const running = new Array(W+1).fill(null);
  let completed = 0, submitted = 0, waitSum = 0, waitN = 0;
  for(const t of all){
    if(t.sub <= T) submitted++;
    if(t.start !== undefined && t.end !== undefined && t.start <= T){
      waitSum += t.start - t.sub; waitN++;
      busy[t.w] += Math.min(t.end, T) - t.start;
      if(t.end <= T){ done[t.w]++; completed++; } else running[t.w] = t;
    }
  }
  for(let i=1;i<=W;i++){
    const el = $('w'+i), r = running[i];
    el.className = 'w' + (r ? ' run' : '');
    el.lastChild.textContent = r ? 'task #'+r.id+' ('+Math.round(T - r.start)+' мс)' : 'idle';
    el.lastChild.textContent += ' · дууссан '+done[i];
  }
  const waiting = all.filter(t => t.sub <= T && (t.start === undefined || t.start > T)).sort((a,b)=>a.sub-b.sub);
  for(let i=0;i<Q;i++){
    const s = $('q'+i), t = waiting[i];
    s.className = 'slot' + (t ? ' full' : ''); s.textContent = t ? '#'+t.id : '';
  }
  const rej = rejects.filter(x => x <= T).length;
  const util = T > 0 ? (busy.reduce((a,b)=>a+b,0) / (T * W) * 100) : 0;
  $('stats').innerHTML =
    stat('Submit хийсэн', submitted + ' / ' + data.params.tasks) +
    stat('Дууссан', completed + ' / ' + data.params.tasks) +
    stat('Queue-д хүлээж буй', waiting.length + ' / ' + Q) +
    stat('Queue дүүрсэн үед хүлээлгэсэн task', '<span class="'+(rej?'bad':'')+'">'+rej+'</span>') +
    stat('Дундаж хүлээлт', waitN ? Math.round(waitSum/waitN) + ' мс' : '—') +
    stat('Worker ашиглалт', util.toFixed(0) + ' %') +
    (T >= total ? stat('C шалгалт (дууссан, max зэрэг ≤ worker)', data.summary.ok ? 'OK (max ' + data.summary.max_running + ')' : '<span class="bad">АЛДАА</span>') : '');
  gantt();
}
function stat(l, v){ return '<div>'+l+'<strong>'+v+'</strong></div>'; }

function gantt(){
  const left = 60, width = 820, lane = 22, H = W*lane + 28;
  const x = t => left + t / total * width;
  let s = '';
  for(let i=1;i<=W;i++){
    const y = (i-1)*lane + 4;
    s += '<text x="0" y="'+(y+14)+'">Worker '+i+'</text><rect x="'+left+'" y="'+y+'" width="'+width+'" height="'+(lane-4)+'" fill="var(--idle)" opacity=".5" rx="3"/>';
  }
  for(const t of Object.values(tasks)){
    if(t.start === undefined || t.start > T) continue;
    const e = Math.min(t.end, T), y = (t.w-1)*lane + 4, w = Math.max(x(e)-x(t.start), 1);
    s += '<rect x="'+x(t.start)+'" y="'+y+'" width="'+w+'" height="'+(lane-4)+'" rx="3" fill="hsl('+hue(t.id)+' 55% 48%)"><title>task #'+t.id+': '+Math.round(t.start)+'–'+Math.round(t.end)+' мс</title></rect>';
    if(w > 22) s += '<text x="'+(x(t.start)+4)+'" y="'+(y+13)+'" style="fill:#fff">'+t.id+'</text>';
  }
  s += '<line x1="'+x(T)+'" x2="'+x(T)+'" y1="0" y2="'+(W*lane+4)+'" stroke="var(--accent)" stroke-width="1.5"/>';
  s += '<text x="'+left+'" y="'+(H-4)+'">0 с</text><text x="'+(left+width-30)+'" y="'+(H-4)+'">'+(total/1000).toFixed(1)+' с</text>';
  const g = $('gantt'); g.setAttribute('viewBox', '0 0 900 '+H); g.innerHTML = s;
}

$('run').onclick = run;
$('replay').onclick = () => play(0);
$('pause').onclick = () => {
  if(playing){ playing = false; $('pause').textContent = 'Үргэлжлүүлэх'; }
  else if(data){ play(T >= total ? 0 : T); }
};
</script>
</body>
</html>
